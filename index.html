/* =====================================================
   Kuali Time — timekeeping for hourly employees (incl. work-study)
   Rounds to 6-minute increments, like the real system.
===================================================== */
function ktFmtTime(d){ let h=d.getHours(),m=d.getMinutes(); const ap=h>=12?"PM":"AM"; h=h%12||12; return `${h}:${String(m).padStart(2,"0")} ${ap}`; }
function ktRound6(ts){ const six=6*60000; return Math.round(ts/six)*six; }   // round a punch to the nearest 6-min clock mark (3:00, 3:06, …)
function ktFmtElapsed(ms){ const s=Math.max(0,Math.floor(ms/1000)); const p=n=>String(n).padStart(2,"0"); return `${p(Math.floor(s/3600))}:${p(Math.floor(s%3600/60))}:${p(s%60)}`; }
function renderKualiTime(){ return `<div class="card"><div id="ktRoot">${ktInner()}</div></div>`; }
function ktInner(){
  const k=P().kualitime;
  if(!k) return `<div class="card-head"><h3>Kuali Time</h3></div>
    <div class="empty">No hourly (or work-study) job is linked to this account.</div>`;
  const todayH=(k.todayMin/60).toFixed(1), weekH=(k.weekMin/60).toFixed(1);
  return `
    <div class="card-head"><h3>Kuali Time</h3>
      <span class="link" onclick="toast('Prototype: opens your detailed time view in Kuali Time.')">Open ↗</span></div>
    <div class="kt-assign"><span class="kt-lbl">Assignment</span><span class="kt-val">${esc(k.assignment)} · ${esc(k.rate)}</span></div>
    <div class="kt-hours">
      <div><div class="kt-h">${todayH}</div><div class="kt-hl">Hours today</div></div>
      <div><div class="kt-h">${weekH}</div><div class="kt-hl">This week</div></div>
    </div>
    ${state.ktIn?`
      <div class="kt-timer"><span class="kt-clock">🕐</span>
        <div id="ktTimer">${ktFmtElapsed(Date.now()-state.ktSince)}</div>
        <div class="kt-since">Clocked in at ${esc(state.ktSinceLabel)}</div></div>
      <button class="kt-btn" onclick="ktClockOut()">Clock out</button>`
    :`<button class="kt-btn" onclick="ktClockIn()">Clock in</button>`}
    <button class="kt-note" onclick="toast('Prototype: report a missed punch.')">Missed punch</button>`;
}
function ktRefresh(){ const r=$("ktRoot"); if(r) r.innerHTML=ktInner(); }
function ktStopTick(){ if(window._ktTimer){ clearInterval(window._ktTimer); window._ktTimer=null; } }
function ktStartTick(){ ktStopTick(); window._ktTimer=setInterval(()=>{
  const el=$("ktTimer"); if(!el||!state.ktIn){ ktStopTick(); return; }
  el.textContent=ktFmtElapsed(Date.now()-state.ktSince);
},1000); }
function ktClockIn(){
  state.ktIn=true;
  state.ktSince=ktRound6(Date.now());               // punch rounded to the nearest 6-min clock mark
  state.ktSinceLabel=ktFmtTime(new Date(state.ktSince));
  ktRefresh(); ktStartTick();
  toast(`Clocked in · logged at ${state.ktSinceLabel}.`);
}
function ktClockOut(){
  const outTs=ktRound6(Date.now());                 // clock-out punch also rounded to the 6-min mark
  const mins=Math.max(0,Math.round((outTs-state.ktSince)/60000));
  P().kualitime.todayMin+=mins; P().kualitime.weekMin+=mins;
  state.ktIn=false; ktStopTick(); ktRefresh();
  toast(`Clocked out · logged at ${ktFmtTime(new Date(outTs))} · ${(mins/60).toFixed(1)} h.`);
}

/* =====================================================
   Today — unified calendar across all IU users.
   Aggregates Exchange (Outlook), SIS (scheduled classes) and
   event RSVPs; de-duplicates, resolving in favor of the
   authoritative non-Exchange system; tags source; adds a CTA.
===================================================== */
const CAL_SRC = {
  Exchange:{label:"Outlook",     cls:"blue"},
  SIS:     {label:"Classes · SIS",cls:"red"},
  Events:  {label:"IU Events",   cls:"gold"},
};
function calDedupe(evs){
  let removed=0;
  const out=evs.filter(e=>{
    // drop an Exchange copy when a non-Exchange system has the same item (by key)
    if(e.src==="Exchange" && e.key && evs.some(o=>o!==e && o.key===e.key && o.src!=="Exchange")){ removed++; return false; }
    return true;
  });
  return {events:out, removed};
}
function calCTA(e){
  if(e.join)            return `<button class="cal-join" onclick="toast('Prototype: joins the ${esc(e.join)} meeting.')">Join ${esc(e.join)} ↗</button>`;
  if(e.src==="Events")  return `<button class="cal-join" onclick="toast('Prototype: opens the event details / RSVP.')">Event details ↗</button>`;
  if(e.src==="SIS")     return `<button class="cal-join" onclick="toast('Prototype: opens this course in Canvas.')">Open in Canvas ↗</button>`;
  return "";
}
function renderCalendar(){
  const {events,removed}=calDedupe(P().calendar||[]);
  const body=
    (events.length
      ? `<div class="sched">${events.map(e=>{const m=CAL_SRC[e.src]||CAL_SRC.Exchange;return `
        <div class="sched-item ${e.now?"sched-now":""}">
          <div class="sched-time"><div class="t1">${esc(e.t1)}</div><div class="t2">${esc(e.t2)}</div></div>
          <div class="sched-body ${esc(e.color||"")}">
            ${e.now?'<span class="sched-tag">Now</span>':""}
            <span class="cal-tag ${m.cls}">${esc(m.label)}</span>
            <div class="st">${esc(e.title)}</div><div class="sl">${esc(e.loc)}</div>
            ${calCTA(e)}
          </div>
        </div>`;}).join("")}</div>`
      : `<div class="empty">Nothing on your calendar today.</div>`);
  return card("📅 Today", body, "",
    `<span class="link" onclick="openFullCalendar()">Full calendar ↗</span>`);
}
/* Full calendar — today + next 4 days, same aggregation + dedup rules */
function calDayLabel(offset){
  const d=new Date(); d.setDate(d.getDate()+offset);
  return { wd:d.toLocaleDateString("en-US",{weekday:"short"}),
           md:d.toLocaleDateString("en-US",{month:"short",day:"numeric"}),
           today:offset===0 };
}
function fullCalendarDays(){
  const base=P().calendar||[];
  const days=[];
  for(let i=0;i<5;i++){
    const raw = i===0 ? base : base.filter(e=>e.recurring);   // day 0 = everything; later days = recurring items
    const {events}=calDedupe(raw);                            // same dedup rule (prefer non-Exchange)
    days.push(Object.assign(calDayLabel(i),{events}));
  }
  return days;
}
function openFullCalendar(){
  const days=fullCalendarDays();
  $("fcModal").innerHTML = `<div class="fc-box">
    <button class="close" onclick="closeFullCalendar()">✕</button>
    <h2>📅 Full calendar</h2>
    <p class="asub">Today and the next 4 days · aggregated from Outlook, SIS classes &amp; event RSVPs.</p>
    <div class="fc-grid">${days.map(d=>`
      <div class="fc-col ${d.today?"today":""}">
        <div class="fc-head"><div class="fc-wd">${d.today?"Today":esc(d.wd)}</div><div class="fc-md">${esc(d.md)}</div></div>
        ${d.events.length ? d.events.map(e=>{const m=CAL_SRC[e.src]||CAL_SRC.Exchange;return `
          <div class="fc-ev ${esc(e.color||"")}">
            <div class="fc-time">${esc(e.t1)}–${esc(e.t2)}</div>
            <div class="fc-t">${esc(e.title)}</div>
            <span class="cal-tag ${m.cls}">${esc(m.label)}</span>
          </div>`;}).join("") : `<div class="fc-none">No events</div>`}
      </div>`).join("")}</div>`;
  $("fcModal").classList.add("open");
}
function closeFullCalendar(){ $("fcModal").classList.remove("open"); }

/* =====================================================
   Omni-search widget — searches One.IU tasks, this user's
   personalized portal content, and general campus content.
   Fixed-width column; results scroll inside a fixed-height panel.
===================================================== */
function buildSearchIndex(){
  const idx=[], seen=new Set();
  const add=o=>{ const k=o.group+"|"+o.title.toLowerCase(); if(seen.has(k))return; seen.add(k); idx.push(o); };
  const p=P();
  // personalized content across this user's tabs
  p.tabs.forEach(tab=>{
    const nav=`omniGo('${tab.id}')`, g="Your "+tab.label;
    (p.views[tab.id]||[]).forEach(w=>{
      if(w.type==="schedule") w.items.forEach(i=>add({icon:"📅",title:i.title,sub:i.loc,tag:tab.label,group:g,run:nav}));
      if(w.type==="list")     w.items.forEach(i=>add({icon:i.icon||"•",title:i.title,sub:i.sub,tag:tab.label,group:g,run:nav}));
      if(w.type==="tasks")    w.items.forEach(i=>add({icon:"✅",title:i.txt,sub:i.due,tag:tab.label,group:g,run:nav}));
      if(w.type==="steps")    w.items.forEach(i=>add({icon:"◉",title:i.title,sub:i.sub,tag:tab.label,group:g,run:nav}));
      if(w.type==="balances") w.items.forEach(i=>add({icon:i.icon,title:i.label,sub:i.value,tag:tab.label,group:g,run:nav}));
    });
  });
  // this user's action items
  (p.actionItems||[]).forEach(i=>add({icon:SOURCES[i.src].icon,title:i.title,sub:i.desc,
    tag:SOURCES[i.src].name.split(" (")[0].split(" · ")[0],group:"Your action items",run:`omniGo('home')`}));
  // One.IU tasks (general services + role-specific)
  TASKS.forEach(t=>add({icon:taskIcon(t),title:t.name,sub:t.desc,tag:t.cat,group:"One.IU tasks",run:`launchTask('${t.id}')`}));
  // general campus content — buildings, parking, buses, food
  allMapPlaces().forEach(pl=>add({icon:TYPE_ICONS[pl.type],title:pl.name,sub:pl.addr||placeSub(pl),
    tag:pl.type,group:"Places & campus",run:`openPlace('${pl.id}')`}));
  return idx;
}
function renderOmnibar(){
  const has = !!state.omniQ.trim();
  return `<div class="omnibar">
    <span class="omnibar-ic">🔍</span>
    <input class="omnibar-input" id="omniInput" type="text" placeholder="Search all of IU"
      value="${esc(state.omniQ).replace(/"/g,"&quot;")}" autocomplete="off"
      oninput="onOmniSearch(this.value)" onkeydown="if(event.key==='Escape')omniClear()">
    <button class="omnibar-clear" id="omniClear" onclick="omniClear()" style="${has?'':'display:none'}">✕</button>
    <div class="omnibar-results" id="omniResults" style="${has?'':'display:none'}">${omniResultsHTML()}</div>
  </div>`;
}
function omniResultsHTML(){
  const q=state.omniQ.trim().toLowerCase();
  if(!q) return `<div class="omni-empty">Start typing to search across your schedule, to-dos and balances, every One.IU service, and campus buildings.</div>`;
  const hits=buildSearchIndex().filter(e=>(e.title+" "+(e.sub||"")+" "+e.tag+" "+e.group).toLowerCase().includes(q));
  if(!hits.length) return `<div class="omni-empty">No matches for “${esc(state.omniQ)}”.</div>`;
  const rank=g=>g.startsWith("Your")?0:g==="One.IU tasks"?1:2;
  const groups=[...new Set(hits.map(h=>h.group))].sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b));
  let out="", total=0;
  for(const g of groups){
    const rows=hits.filter(h=>h.group===g).slice(0,6);
    if(!rows.length || total>=24) continue;
    out += `<div class="omni-group">${esc(g)}</div>` + rows.map(r=>`
      <div class="ores" onclick="${r.run}">
        <div class="oic">${r.icon}</div>
        <div style="min-width:0"><div class="ot">${esc(r.title)}</div><div class="os">${esc(r.sub||"")}</div></div>
        <span class="otag">${esc(r.tag)}</span>
      </div>`).join("");
    total += rows.length;
  }
  return out;
}
function onOmniSearch(v){
  state.omniQ=v;
  const has=!!v.trim();
  const r=$("omniResults"); if(r){ r.innerHTML=omniResultsHTML(); r.style.display=has?"block":"none"; }
  const c=$("omniClear"); if(c) c.style.display=has?"flex":"none";
}
function omniClear(){ state.omniQ=""; const i=$("omniInput"); if(i){ i.value=""; i.focus(); } onOmniSearch(""); }
function omniGo(tab){ state.omniQ=""; setTab(tab); }

   Customizable widget layout
   Layouts are stored per persona + tab as
   {order:[defIndices], removed:[defIndices]} and persisted.
===================================================== */
let layouts = {};
(function loadLayouts(){
  try{ const s = localStorage.getItem("oneiu_layouts"); if(s) layouts = JSON.parse(s)||{}; }catch(e){}
})();
function saveLayouts(){
  try{ localStorage.setItem("oneiu_layouts", JSON.stringify(layouts)); }catch(e){}
}
/* Tokens are strings: "0","1"… index a persona's default defs;
   "cat:orgs" is a catalog widget added by the user. */
function getLayout(){
  const p=state.persona, t=state.tab;
  const defs=DATA[p].views[t]||[];
  const all=[...defs.keys()].filter(i=>!FIXED_TYPES.includes(defs[i].type)).map(String);
  layouts[p]=layouts[p]||{};
  let lay=layouts[p][t];
  if(!lay || !Array.isArray(lay.order) || !Array.isArray(lay.removed)){
    lay={order:[...all],removed:[]};
  } else {
    lay.order  = lay.order.map(String).filter(tok=> tok.startsWith("cat:") || all.includes(tok));
    lay.removed= lay.removed.map(String).filter(tok=> all.includes(tok));
    all.forEach(i=>{ if(!lay.order.includes(i) && !lay.removed.includes(i)) lay.order.push(i); });
    lay.order=[...new Set(lay.order)];
  }
  layouts[p][t]=lay; return lay;
}
function tokenDef(tok){
  return tok.startsWith("cat:") ? {type:tok.slice(4)} : (DATA[state.persona].views[state.tab]||[])[Number(tok)];
}
function visibleTokens(){ const lay=getLayout(); return lay.order.filter(tok=> tok.startsWith("cat:") || !lay.removed.includes(tok)); }
function visibleTypes(){ return visibleTokens().map(tokenDef).filter(Boolean).map(d=>d.type); }

function widgetInfo(def){

    assignments:"From Canvas — your enrolled courses.",crimsoncard:"Card and balances from CSGold.",

/* drag & drop (grabber-armed) */
function armDrag(btn){
  const w=btn.closest(".widget"); if(!w) return;
  w.setAttribute("draggable","true");
  const off=()=>{ w.setAttribute("draggable","false"); document.removeEventListener("mouseup",off); };
  document.addEventListener("mouseup",off);
}
function wDragStart(e,el){
  window._dragTok = el.dataset.tok;
  el.classList.add("dragging");
  if(e.dataTransfer){ e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain","widget");}catch(_){} }
}
function wDragEnd(e,el){
  el.classList.remove("dragging");
  document.querySelectorAll(".widget.drop-target").forEach(x=>x.classList.remove("drop-target"));
  window._dragTok = null;
}
function wDragOver(e,el){
  if(window._dragTok==null || el.dataset.tok===window._dragTok) return;
  e.preventDefault();
  if(e.dataTransfer) e.dataTransfer.dropEffect="move";
  el.classList.add("drop-target");
}
function wDrop(e,el){
  e.preventDefault(); el.classList.remove("drop-target");
  const from=window._dragTok, to=el.dataset.tok;
  window._dragTok=null;
  if(from==null || from===to) return;
  const r=el.getBoundingClientRect();
  moveWidget(from, to, (e.clientY - r.top) < r.height/2);
}
/* tap-to-move fallback (touch / no drag) */
function grabClick(ev,tok){
  ev.stopPropagation();
  if(state.moving==null){
    state.moving=tok; renderMain();
    toast("Widget selected — tap the grabber where it should move to.");
  } else if(state.moving===tok){
    state.moving=null; renderMain();
  } else {
    const from=state.moving; state.moving=null;
    moveWidget(from,tok,true);
  }
}
function moveWidget(from,to,before=true){
  const lay=getLayout();
  const o=lay.order.filter(x=>x!==from);
  let idx=o.indexOf(to); if(idx<0) idx=o.length; else if(!before) idx++;
  o.splice(idx,0,from);
  lay.order=o; saveLayouts(); renderMain();
}
function removeWidget(ev,tok){
  ev.stopPropagation();
  const lay=getLayout();
  if(tok.startsWith("cat:")) lay.order=lay.order.filter(x=>x!==tok);
  else if(!lay.removed.includes(tok)) lay.removed.push(tok);
  if(state.moving===tok) state.moving=null;
  saveLayouts(); renderMain();
  toast("Widget removed. Add it back from “＋ Add widgets”.");
}
function restoreWidget(tok){
  const lay=getLayout();
  lay.removed=lay.removed.filter(x=>x!==tok);
  saveLayouts(); renderMain(); openWidgetPicker();
}
/* Add any catalog widget — even one not in this persona's defaults. */
function addCatalogWidget(type){
  const lay=getLayout();
  if(visibleTypes().includes(type)){ toast("That widget is already on this screen."); return; }
  const defs=DATA[state.persona].views[state.tab]||[];
  const removedSame=lay.removed.find(tok=>{ const d=defs[Number(tok)]; return d && d.type===type; });
  if(removedSame!==undefined) lay.removed=lay.removed.filter(x=>x!==removedSame); // restore in place
  else lay.order.push("cat:"+type);
  saveLayouts(); renderMain(); openWidgetPicker();
  toast("Widget added to this screen.");
}
function resetLayout(){
  const p=state.persona, t=state.tab;
  if(layouts[p]) delete layouts[p][t];
  state.moving=null;
  saveLayouts(); renderMain();
  toast("Screen restored to the default layout.");
}
function openWidgetPicker(){
  const defs=P().views[state.tab]||[];
  const lay=getLayout();
  const vis=visibleTypes();
  const catRows = WIDGET_CATALOG.filter(w=>!w.need || P()[w.need]).map(w=>`
    <div class="wp-row">
      <div style="flex:1;min-width:0"><div class="wpn">${w.label}</div><div class="lis">${w.desc}</div></div>
      ${vis.includes(w.type)
        ? `<span class="badge gray">On screen</span>`
        : `<button class="wp-add" onclick="addCatalogWidget('${w.type}')">＋ Add</button>`}
    </div>`).join("");
  const removedCtx = lay.removed.filter(tok=>{ const d=defs[Number(tok)]; return d && !WIDGET_CATALOG.some(w=>w.type===d.type); });
  const ctxRows = removedCtx.map(tok=>`
    <div class="wp-row"><div class="wpn">${widgetLabel(defs[Number(tok)])}</div>
      <button class="wp-add" onclick="restoreWidget('${tok}')">＋ Add</button></div>`).join("");
  $("drawer").innerHTML = `
    <button class="close" onclick="closeDrawer()">✕</button>
    <h2>＋ Add widgets</h2>
    <p class="dsub">Add any widget to this screen — even ones not shown by default.</p>
    <div class="dsec"><h4>🧩 Widget library</h4>${catRows}</div>
    ${ctxRows ? `<div class="dsec"><h4>↩︎ Removed from this screen</h4>${ctxRows}</div>` : ""}
    <div class="dsec"><h4>↺ Start over</h4>
      <button class="lbtn" onclick="resetLayout();closeDrawer()">Reset this screen to default</button></div>`;
  $("drawer").classList.add("open"); $("scrim").classList.add("open");
}

/* ---------- shell ---------- */
/* Official IU trident (Rivet design-system mark, iu.edu), crimson via currentColor */
const TRIDENT = `<svg class="trident" viewBox="0 0 28 34" fill="currentColor" aria-label="Indiana University" role="img">
  <path d="M-3.34344e-05 4.70897H8.83308V7.174H7.1897V21.1426H10.6134V2.72321H8.83308V0.121224H18.214V2.65476H16.2283V21.1426H19.7889V7.174H18.214V4.64047H27.0471V7.174H25.0614V23.6761L21.7746 26.8944H16.2967V30.455H18.214V33.8787H8.76463V30.592H10.6819V26.8259H5.20403L1.91726 23.6077V7.174H-3.34344e-05V4.70897Z"/>
</svg>`;
function renderSidebar(){
  const p = P();
  $("sidebar").innerHTML = `
    <div class="logo"><div class="logo-mark">${TRIDENT}</div><div class="logo-name">One<span>.IU</span></div></div>
    <div class="nav">${p.tabs.map(t=>`
      <button class="${state.tab===t.id?"active":""}" onclick="setTab('${t.id}')">
        <span class="ic">${t.icon}</span>${t.label}</button>`).join("")}
    </div>
    <div class="side-foot">
      ${p.guest ? `<b>Not signed in</b><br>Public view
        <button onclick="toast('Prototype: opens IU Login (CAS + two-step / Duo).')">Sign in</button>`
      : `Signed in as <b>${p.name}</b><br>${p.role}
        <button onclick="toggleAdmin(true)">Switch persona</button>`}
    </div>`;
}
function renderBottomNav(){
  const p = P();
  $("bottomNav").innerHTML = p.tabs.map(t=>`
    <button class="${state.tab===t.id?"active":""}" onclick="setTab('${t.id}')">
      <span class="bic">${t.icon}</span>${t.label}</button>`).join("");
}
function renderMain(){
  const p = P();
  const toks = visibleTokens();
  const cards = toks.map(tokenDef).filter(Boolean);
  const tabLabel = p.tabs.find(t=>t.id===state.tab)?.label || "";
  const isHome = state.tab==="home";
  const allDefs = P().views[state.tab]||[];
  const fixedHtml = allDefs.filter(d=>FIXED_TYPES.includes(d.type)).map(d=>`<div class="fixed-block">${renderCard(d)}</div>`).join("");
  const hasCustom = allDefs.some(d=>!FIXED_TYPES.includes(d.type));
  const gridHtml = toks.length
    ? toks.map(tok=>{ const d=tokenDef(tok); return d?widgetWrap(tok,d):""; }).join("")
    : `<div class="grid-empty">This screen is empty.<br><br>
        <button onclick="openWidgetPicker()">＋ Add widgets</button> &nbsp;·&nbsp;
        <button onclick="resetLayout()">↺ Reset to default</button></div>`;
  $("main").innerHTML = `
    <div class="topbar">
      <div class="greeting">
        <h1>${isHome ? (p.guest ? "Welcome to One.IU" : `${greeting()}, ${p.first}`) : tabLabel}</h1>
        <p>${isHome ? (p.guest ? p.greetSub : `${todayStr()} · ${p.greetSub}`) : p.role}</p>
      </div>
      <div class="top-actions">
        ${p.guest ? "" : `<button class="icon-btn" onclick="openNotifs()">🔔${p.notifCount?'<span class="dot"></span>':""}</button>`}
        <div class="avatar" onclick="openSettings()" title="Profile & settings">${p.avatar}</div>
      </div>
    </div>
    ${renderOmnibar()}
    ${fixedHtml}
    ${hasCustom ? `<div class="layout-bar">
      <button class="lbtn" onclick="openWidgetPicker()">＋ Add widgets</button>
      <button class="lbtn" onclick="resetLayout()">↺ Reset layout</button>
    </div>
    <div class="grid">${gridHtml}</div>` : ``}`;
  if(allDefs.some(d=>d.type==="campusmap")) setTimeout(setupCampusMap,0);
  if(cards.some(c=>c.type==="kualitime") && state.ktIn) setTimeout(ktStartTick,0); else if(!cards.some(c=>c.type==="kualitime")) ktStopTick();
  const inner = $("main"); inner.classList.remove("main-inner"); void inner.offsetWidth; inner.classList.add("main-inner");
}
function render(){ renderSidebar(); renderBottomNav(); renderMain(); }

/* ---------- interactions ---------- */
function setTab(id){ state.tab=id; state.q=""; state.cat="All"; state.moving=null; state.omniQ="";
  if(id==="tasks"){
    state.fRoles = P().guest?[]:personaRoles(state.persona).slice();
    state.fCampuses = P().guest ? (state.campus?[state.campus]:[]) : personaCampuses(state.persona).slice();
  }
  render(); window.scrollTo({top:0}); }
function goToTaskSearch(){
  setTab("tasks");
  setTimeout(()=>{ const i=$("taskSearchInput"); if(i) i.focus(); },50);
}
function setCampus(id){
  state.campus = id || null;
  try{ localStorage.setItem("oneiu_campus_"+state.persona, id||"none"); }catch(e){}
  closeDrawer();
  render();
  const c=curCampus();
  toast(c ? `Campus set to ${c.name}` : "No campus selected");
}
function openCampusPicker(){
  const opt = c => `
    <button class="camp-opt ${state.campus===c.id?"sel":""}" onclick="setCampus('${c.id}')">
      <span class="camp-radio"></span>
      <span style="min-width:0"><span class="co-name">${esc(c.name)}</span><br><span class="co-city">${esc(c.city)}</span></span>
    </button>`;
  $("drawer").innerHTML = `
    <button class="close" onclick="closeDrawer()">✕</button>
    <h2>Choose your campus</h2>
    <p class="dsub">Switch anytime to explore another IU campus. Your classes and account stay with your home campus.</p>
    <div class="camp-list">
      ${CAMPUSES.map(opt).join("")}
      <button class="camp-opt none-opt ${!state.campus?"sel":""}" onclick="setCampus('')">
        <span class="camp-radio"></span><span class="co-name">None selected</span>
      </button>
    </div>`;
  $("drawer").classList.add("open"); $("scrim").classList.add("open");
}
function setPersona(key){
  state.persona=key; state.tab="home"; state.checked={}; state.q=""; state.cat="All"; state.moving=null;
  state.campus = loadCampusFor(key);
  state.favs = new Set(DATA[key].favorites);
  state.ai = { filter:"all", explain:false };
  state.omniQ = "";
  if(typeof ktStopTick==="function") ktStopTick();
  state.ktIn=false;
  toggleAdmin(false); closeDrawer(); render(); window.scrollTo({top:0});
  toast(`Now viewing as ${DATA[key].name} — ${DATA[key].role}`);
}
function toggleTask(id){ state.checked[id]=!state.checked[id]; renderMain(); }

function toggleAdmin(open){
  $("adminModal").classList.toggle("open",open);
  if(open){
    $("personaGrid").innerHTML = Object.entries(DATA).map(([k,p])=>`
      <button class="pcard ${state.persona===k?"sel":""}" onclick="setPersona('${k}')">
        <div class="pav">${p.avatar}</div>
        <div class="pr">${p.role}</div>
        <div class="pn">${p.name}</div>
        <div class="pd">${p.adminDesc}</div>
        <div class="sel-tag">✓ Currently viewing</div>
      </button>`).join("");
  }
}
function openNotifs(){
  const p = P();
  $("drawer").innerHTML = `
    <button class="close" onclick="closeDrawer()">✕</button>
    <h2>🔔 Notifications</h2>
    <p class="dsub">${p.notifCount} unread</p>
    ${p.notifications.map(n=>`
      <div class="notif ${n.unread?"unread":""}">
        <div class="nic">${n.icon}</div>
        <div><div class="nt">${esc(n.title)}</div><div class="ns">${esc(n.sub)}</div><div class="ntime">${esc(n.time)}</div></div>
      </div>`).join("")}`;
  $("drawer").classList.add("open"); $("scrim").classList.add("open");
}
function closeDrawer(){
  $("drawer").classList.remove("open"); $("scrim").classList.remove("open");
}

/* ---------- Profile & settings ---------- */
function applyPrefs(){
  document.body.classList.toggle("dark", state.theme==="dark");
  document.body.classList.toggle("reduce-motion", !!state.settings.reduceMotion);
}
function savePrefs(){
  try{ localStorage.setItem("oneiu_theme",state.theme);
       localStorage.setItem("oneiu_settings",JSON.stringify(state.settings)); }catch(e){}
}
function toggleTheme(){ state.theme = state.theme==="dark"?"light":"dark"; savePrefs(); applyPrefs(); openSettings(); }
function toggleSetting(k){ state.settings[k]=!state.settings[k]; savePrefs(); applyPrefs(); openSettings(); }
function signOut(){ closeDrawer(); setPersona("guest"); }
function sw(on,handler){ return `<button class="switch ${on?"on":""}" onclick="${handler}"></button>`; }
function setRow(icon,title,sub,right){
  return `<div class="set-row"><div class="si">${icon}</div>
    <div style="min-width:0"><div class="st">${title}</div><div class="ss">${sub}</div></div>
    <div class="set-right">${right}</div></div>`;
}
function openSettings(){
  const p=P(), dark=state.theme==="dark";
  $("drawer").innerHTML = `
    <button class="close" onclick="closeDrawer()">✕</button>
    <h2>Profile &amp; settings</h2>
    <div class="set-profile">
      <div class="set-av">${p.avatar}</div>
      <div style="min-width:0"><div class="set-name">${p.guest?"Not signed in":esc(p.name)}</div>
        <div class="set-role">${esc(p.role)}</div></div>
    </div>
    <div class="dsec"><h4>Account</h4>
      ${p.guest
        ? `<button class="act" style="width:100%;justify-content:center" onclick="toast('Prototype: opens IU Login (CAS + two-step / Duo).')">Sign in with your IU username</button>`
        : `<button class="act ghost" style="width:100%;justify-content:center" onclick="signOut()">↩︎ Sign out</button>`}
    </div>
    <div class="dsec"><h4>Campus</h4>
      <div class="set-row" style="cursor:pointer" onclick="openCampusPicker()">
        <div class="si">📍</div>
        <div style="min-width:0"><div class="st">Campus</div>
          <div class="ss">${curCampus()?esc(curCampus().name):"None selected"}</div></div>
        <div class="set-right">›</div></div>
    </div>
    <div class="dsec"><h4>Appearance</h4>
      ${setRow(dark?"🌙":"☀️","Dark mode",(dark?"On":"Off")+" · easier on the eyes at night",sw(dark,"toggleTheme()"))}
    </div>
    <div class="dsec"><h4>Notifications</h4>
      ${setRow("🔔","Push notifications","Deadlines, holds & campus alerts",sw(state.settings.notifs,"toggleSetting('notifs')"))}
      ${setRow("✉️","Weekly email digest","A summary of your Action Items",sw(state.settings.digest,"toggleSetting('digest')"))}
    </div>
    <div class="dsec"><h4>Accessibility</h4>
      ${setRow("🎬","Reduce motion","Minimize animations and transitions",sw(state.settings.reduceMotion,"toggleSetting('reduceMotion')"))}
    </div>
    <div class="dsec"><h4>General</h4>
      <div class="set-row" style="cursor:pointer" onclick="toast('Prototype: language settings.')">${'<div class="si">🌐</div><div style="min-width:0"><div class="st">Language</div><div class="ss">English (US)</div></div><div class="set-right">›</div>'}</div>
      <div class="set-row" style="cursor:pointer" onclick="toast('Prototype: privacy & data sharing.')">${'<div class="si">🔒</div><div style="min-width:0"><div class="st">Privacy &amp; data sharing</div><div class="ss">Manage what you share</div></div><div class="set-right">›</div>'}</div>
      <div class="set-row" style="cursor:pointer" onclick="toggleAdmin(true)">${'<div class="si">🛠️</div><div style="min-width:0"><div class="st">Switch persona (demo)</div><div class="ss">Preview One.IU as another member</div></div><div class="set-right">›</div>'}</div>
    </div>
    <div class="cc-hint" style="margin-top:8px">One.IU prototype · v0.9</div>`;
  $("drawer").classList.add("open"); $("scrim").classList.add("open");
}

let toastTimer;
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2600);
}

$("adminModal").addEventListener("click",e=>{ if(e.target.id==="adminModal") toggleAdmin(false); });
$("fcModal").addEventListener("click",e=>{ if(e.target.id==="fcModal") closeFullCalendar(); });
$("onbModal").addEventListener("click",e=>{ if(e.target.id==="onbModal") dismissOnboarding(); });

/* first-run campus onboarding (IU Mobile style) */
function maybeOnboard(){
  let done=false; try{ done=localStorage.getItem("oneiu_onboarded")==="1"; }catch(e){}
  if(done || state.campus) return;
  $("onbList").innerHTML = CAMPUSES.map(c=>`
    <button class="camp-opt" onclick="onbPick('${c.id}')">
      <span class="camp-radio"></span>
      <span style="min-width:0"><span class="co-name">${esc(c.name)}</span><br><span class="co-city">${esc(c.city)}</span></span>
    </button>`).join("") + `
    <button class="camp-opt none-opt" onclick="onbPick('')"><span class="camp-radio"></span><span class="co-name">None selected</span></button>`;
  $("onbModal").classList.add("open");
}
function dismissOnboarding(){ try{localStorage.setItem("oneiu_onboarded","1");}catch(e){} $("onbModal").classList.remove("open"); }
function onbPick(id){ dismissOnboarding(); setCampus(id); }

applyPrefs();
render();
maybeOnboard();
</script>
</body>
